name: Daily Sydney & Melbourne Concert Sync

on:
  schedule:
    # Runs daily at 20:30 UTC (07:30 AEDT Sydney/Melbourne)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-au-gigs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Sydney & Melbourne Concerts
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node ./server/syncCatalog.mjs

      - name: Commit refreshed concert snapshot if changed
        run: |
          if [ -f server/cache/live-catalog.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f server/cache/live-catalog.json
            git diff --staged --quiet || git commit -m "chore(catalog): daily Sydney & Melbourne gig sync"
            git push
          fi
