name: Daily Sydney & Melbourne Concert Sync

on:
  schedule:
    # Runs daily at 20:30 UTC (07:30 AEDT Sydney/Melbourne)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gig-sync
  cancel-in-progress: false

jobs:
  sync-au-gigs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Snapshot previous catalog before sync
        run: |
          if [ -f server/cache/live-catalog.json ]; then
            cp server/cache/live-catalog.json /tmp/oz-amp-prev-catalog.json
          fi

      - name: Sync Sydney & Melbourne Concerts
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node ./server/syncCatalog.mjs

      - name: Evaluate 275-Singer Watchlist & World Festivals Push Digest
        env:
          PREV_CATALOG_FILE: /tmp/oz-amp-prev-catalog.json
          REMINDER_WEBHOOK_URL: ${{ secrets.REMINDER_WEBHOOK_URL }}
        run: node ./server/dailyDigestAlert.mjs

      - name: Commit refreshed concert snapshot if changed
        run: |
          if [ -f server/cache/live-catalog.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f server/cache/live-catalog.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(catalog): daily Sydney & Melbourne gig sync"
              git pull --rebase origin main || true
              git push
            fi
          fi
